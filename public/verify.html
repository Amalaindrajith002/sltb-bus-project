<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Verification - Conductor Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-green-600 mb-2">ටිකට් පරීක්ෂාව (Conductor Verify)</h1>
        <p class="text-center text-gray-600 text-sm mb-6">මගියාගේ බුකින් අංකය ඇතුළත් කර ටිකට්පත තහවුරු කරන්න</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600">બුකින් අංකය (Booking ID):</label>
                <input type="number" id="bookingIdInput" placeholder="උදා: 1" class="w-full mt-1 p-2 border rounded-md">
            </div>
            <button onclick="verifyTicket()" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 transition">ටිකට් පරීක්ෂා කරන්න</button>
        </div>

        <div id="verifyResult" class="mt-6"></div>
    </div>

    <script>
        async function verifyTicket() {
            const bookingId = document.getElementById('bookingIdInput').value;
            const resultDiv = document.getElementById('verifyResult');

            if (!bookingId) {
                alert('කරුණාකර බුකින් අංකයක් ඇතුළත් කරන්න!');
                return;
            }

            resultDiv.innerHTML = '<p class="text-center text-gray-500">පරීක්ෂා කරමින් පවතී...</p>';

            try {
                // Backend එකෙන් බුකින් එක සෙවීම සඳහා සරල fetch එකක් (අපි server.js එකේ API එකක් හදාගමු)
                const response = await fetch(`http://localhost:5000/api/bookings/verify/${bookingId}`);
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="bg-green-50 border border-green-300 p-4 rounded-md space-y-2 text-sm text-green-900">
                            <p class="font-bold text-center text-green-700 text-base">✅ නීත්‍යානුකූල ටිකට්පතකි (Valid Ticket)</p>
                            <p><b>ބස් අංකය:</b> ${data.bus_number} (${data.bus_type})</p>
                            <p><b>මාර්ගය:</b> ${data.route_number} (${data.origin} - ${data.destination})</p>
                            <p><b>ආසන අංකය:</b> ${data.seat_number}</p>
                            <p><b>ගෙවීම් තත්ත්වය:</b> ${data.payment_status}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="bg-red-50 border border-red-300 p-4 rounded-md text-center text-red-700 text-sm font-bold">
                            ❌ අමාನ್ಯ හෝ අවලංගු කරන ලද ටිකට්පතකි! (${data.message || 'Not found'})
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = '<p class="text-center text-red-500 text-sm">පරීක්ෂා කිරීමේදී දෝෂයක් ඇති විය.</p>';
            }
        }
    </script>
</body>
</html>
