<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SLTB Bus System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">පද්ධතියට පිවිසෙන්න (Login)</h1>
        
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600">පරිශීලක වර්ගය (User Type):</label>
                <select id="userType" class="w-full mt-1 p-2 border rounded-md">
                    <option value="passenger">මගියා (Passenger)</option>
                    <option value="owner">බස් හිමියා (Bus Owner)</option>
                    <option value="admin">පරිපාලක (Admin)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600">ඊමේල් ලිපිනය (Email):</label>
                <input type="email" id="email" required class="w-full mt-1 p-2 border rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600">මුුදනපදය (Password):</label>
                <input type="password" id="password" required class="w-full mt-1 p-2 border rounded-md">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition">පිවිසෙන්න</button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const userType = document.getElementById('userType').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, userType })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('සාර්ථකයි! පිළිගනිමු ' + result.user.name);
                    
                    // අදාළ යූසර් වර්ගයට අනුව අදාළ Dashboard එකට යැවීම
                    if (userType === 'admin') {
                        window.location.href = '/admin.html';
                    } else if (userType === 'owner') {
                        window.location.href = '/owner-dashboard.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                } else {
                    alert('දෝෂයකි: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('සමාවන්න, ලොග් වීමේදී දෝෂයක් ඇති විය.');
            }
        }
    </script>
</body>
</html>
